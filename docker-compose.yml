services:
  api:
    build:
      context: .
      dockerfile: src/AddressAutocomplete.Api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=address_autocomplete;Username=postgres;Password=${POSTGRES_PASSWORD}"
      AzureMaps__SubscriptionKey: "${AZURE_MAPS_SUBSCRIPTION_KEY}"
      AzureMaps__DefaultBoundingBox: "-74,-34,-34,6"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: address_autocomplete
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d address_autocomplete"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: